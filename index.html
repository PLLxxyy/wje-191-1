<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地形地貌 3D 展示</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

      .ui-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      .layer-panel {
        position: absolute;
        top: 16px; left: 16px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 12px;
        padding: 16px;
        pointer-events: auto;
        color: #e2e8f0;
        min-width: 200px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
      .layer-panel h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #a5b4fc;
        letter-spacing: 0.5px;
      }
      .layer-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        cursor: pointer;
        font-size: 13px;
        transition: color 0.2s;
      }
      .layer-item:hover { color: #c7d2fe; }
      .layer-checkbox {
        width: 16px; height: 16px;
        border: 1.5px solid #6366f1;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .layer-checkbox.checked {
        background: #6366f1;
      }
      .layer-checkbox.checked::after {
        content: "✓";
        color: white;
        font-size: 11px;
        line-height: 1;
      }

      .region-panel {
        position: absolute;
        top: 16px; right: 16px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 12px;
        padding: 16px;
        pointer-events: auto;
        color: #e2e8f0;
        min-width: 180px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
      .region-panel h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        color: #a5b4fc;
        letter-spacing: 0.5px;
      }
      .region-btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 6px;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.25);
        border-radius: 8px;
        color: #cbd5e1;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
      }
      .region-btn:hover { background: rgba(99, 102, 241, 0.2); color: #e2e8f0; }
      .region-btn.active {
        background: rgba(99, 102, 241, 0.35);
        border-color: #6366f1;
        color: #e2e8f0;
        font-weight: 500;
      }

      .region-info {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(99, 102, 241, 0.2);
        font-size: 12px;
        line-height: 1.7;
        color: #94a3b8;
      }

      .info-bar {
        position: absolute;
        bottom: 16px; left: 16px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 10px;
        padding: 10px 16px;
        pointer-events: none;
        color: #e2e8f0;
        font-size: 13px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        display: flex;
        gap: 20px;
      }
      .info-item { display: flex; gap: 6px; align-items: center; }
      .info-label { color: #64748b; font-size: 12px; }
      .info-value { color: #a5b4fc; font-weight: 500; }

      .profile-panel {
        position: absolute;
        bottom: 16px; right: 16px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 12px;
        padding: 16px;
        pointer-events: auto;
        color: #e2e8f0;
        width: 380px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
      .profile-panel h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #a5b4fc;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .profile-panel .hint {
        font-size: 11px;
        color: #64748b;
        font-weight: 400;
        margin-bottom: 8px;
      }
      .profile-canvas-wrap {
        width: 100%;
        height: 120px;
        background: rgba(0,0,0,0.3);
        border-radius: 8px;
        overflow: hidden;
        position: relative;
      }
      .profile-canvas-wrap canvas { display: block; }
      .profile-close {
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        font-size: 18px;
        padding: 0 4px;
        line-height: 1;
      }
      .profile-close:hover { color: #e2e8f0; }

      .toolbar {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 10px;
        padding: 8px 16px;
        pointer-events: auto;
        display: flex;
        gap: 12px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
      .tool-btn {
        padding: 6px 14px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 6px;
        color: #cbd5e1;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tool-btn:hover { background: rgba(99, 102, 241, 0.3); color: #e2e8f0; }
      .tool-btn.active { background: #6366f1; color: white; border-color: #6366f1; }

      .tooltip-3d {
        position: absolute;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(99, 102, 241, 0.4);
        border-radius: 8px;
        padding: 8px 12px;
        pointer-events: none;
        color: #e2e8f0;
        font-size: 12px;
        white-space: nowrap;
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        z-index: 20;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
